<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>سلف موظفي وعمال أمازون سوبر ماركت</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#39705c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="سلف الموظفين">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <div class="auth-brand">
        <img src="logo.jpg" alt="Amazon Super Market">
        <h1>نظام سلف موظفي وعمال أمازون</h1>
        <p>تسجيل الدخول</p>
      </div>

      <div class="auth-panel">
        <label>اختر اسمك
          <select id="loginNameSelect" autocomplete="username">
            <option value="">اختر الاسم</option>
          </select>
        </label>

        <div id="loginExisting">
          <label>كلمة المرور
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور">
          </label>
          <button type="button" class="auth-submit" id="loginBtn">دخول</button>
          <button type="button" class="password-link first-setup-link hidden" id="showFirstSetupBtn">إعداد كلمة المرور لأول مرة</button>
          <button type="button" class="password-link" id="changePasswordBtn">تغيير كلمة المرور</button>
          <button type="button" class="password-link danger-link" id="forgotPasswordBtn">نسيت كلمة المرور؟</button>
        </div>
      </div>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <div class="page">
    <header class="top redesigned-top">
      <div class="brand">
        <img src="logo.jpg" alt="Amazon Super Market">
        <div class="brand-text">
          <div class="brand-en">AMAZON<br><span>SUPER MARKET</span></div>
          <div class="brand-ar">أمازون سوبر ماركت</div>
        </div>
      </div>
      <div class="title-box">
        <div class="title">نظام إدارة الموظفين والعمال</div>
        <div class="month-title">أمازون سوبر ماركت</div>
      </div>
    </header>

    <section class="dashboard-info">
      <div class="today"><span>التاريخ اليوم</span><strong id="today"></strong></div>
      <div class="today current-user"><span>المستخدم الحالي</span><strong id="currentUserName"></strong></div>
      <button class="tool logout" id="logoutBtn"><span class="tool-icon">↪</span><span class="tool-label">تسجيل الخروج</span></button>
    </section>

    <section class="home-dashboard" id="homeDashboard">
      <div class="home-heading">
        <div>
          <span class="home-kicker">لوحة التحكم الرئيسية</span>
          <h1>اختر القسم الذي تريد العمل عليه</h1>
        </div>
      </div>
      <div class="home-cards">
        <button class="home-card advances-card main-nav" id="advancesNav">
          <span class="home-card-icon">💰</span><span class="home-card-title">السلف</span>
        </button>
        <button class="home-card leaves-card main-nav" id="leavesNav">
          <span class="home-card-icon">📅</span><span class="home-card-title">الإجازات والزمنيات</span>
        </button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js?v=20261007-3"></script>
</body>
</html>
